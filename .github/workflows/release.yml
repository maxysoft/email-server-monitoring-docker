name: Build & Publish (GHCR)

# Builds a multi-arch Docker image, publishes it to GitHub Container Registry,
# and signs it with cosign (keyless). Triggers ONLY on commits pushed to the
# `release` branch, plus a manual workflow_dispatch with optional version
# override / skip switch.
on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version override (e.g. v1.2.3). Blank = VERSION repo variable -> VERSION file -> commit sha."
        required: false
        type: string
      skip_build:
        description: "Skip the build & publish for this run."
        required: false
        type: boolean
        default: false

# Cancel an in-progress release build if a newer commit lands on the branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Skip-build check: skip when a manual run sets skip_build=true, or when the
    # triggering commit message contains [skip build] or [skip ci].
    if: >-
      ${{ !(
        (github.event_name == 'workflow_dispatch' && inputs.skip_build == true) ||
        (github.event_name == 'push' && (
          contains(github.event.head_commit.message, '[skip build]') ||
          contains(github.event.head_commit.message, '[skip ci]')
        ))
      ) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version
        id: ver
        # Precedence: workflow_dispatch input -> repo variable VERSION -> ./VERSION file -> v0.0.0-<sha>.
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"; SRC="workflow input"
          elif [ -n "${{ vars.VERSION }}" ]; then
            V="${{ vars.VERSION }}"; SRC="repo variable"
          elif [ -f VERSION ]; then
            V="$(tr -d '[:space:]' < VERSION)"; SRC="VERSION file"
          else
            V="v0.0.0-${GITHUB_SHA::7}"; SRC="commit sha fallback"
          fi
          echo "Resolved version '$V' (source: $SRC)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Compute image name (lowercase)
        id: img
        run: |
          set -euo pipefail
          NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            BUILD_DATE=${{ steps.ver.outputs.build_date }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.img.outputs.name }}
        # Signing by digest covers the manifest regardless of tag. Identity is the
        # GitHub OIDC token (no long-lived keys); verify later with:
        #   cosign verify <image> \
        #     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        run: |
          {
            echo "### Published & signed image"
            echo ""
            echo "- \`${{ steps.img.outputs.name }}:${{ steps.ver.outputs.version }}\`"
            echo "- \`${{ steps.img.outputs.name }}:latest\`"
            echo "- platforms: linux/amd64, linux/arm64"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
